<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Outer Crest -->
  <polygon points="256,50 430,120 430,340 256,460 82,340 82,120" stroke="#38bdf8" stroke-width="12" fill="#0f172a" fill-opacity="0.85" filter="url(#shadow)"/>
  <polygon points="256,85 395,145 395,320 256,420 117,320 117,145" stroke="#0284c7" stroke-width="8" fill="none"/>
  
  <!-- High Tensile Kinetic Strands -->
  <line x1="256" y1="85" x2="256" y2="420" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  <line x1="117" y1="145" x2="395" y2="320" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <line x1="117" y1="320" x2="395" y2="145" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Central Kinetic Core -->
  <circle cx="256" cy="232" r="42" fill="url(#glow)"/>
  <polygon points="256,200 278,245 256,236 234,245" fill="#ffffff"/>
  
  <!-- Logo Text -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#38bdf8" letter-spacing="4">VANGUARD</text>
</svg>
